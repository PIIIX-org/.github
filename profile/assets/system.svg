    <radialGradient id="corona"><stop offset="0" stop-color="#fd9f13" stop-opacity=".55"/><stop offset=".5" stop-color="#fd9f13" stop-opacity=".12"/><stop offset="1" stop-color="#fd9f13" stop-opacity="0"/></radialGradient>
    <radialGradient id="planet" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#f5f9fb"/><stop offset=".6" stop-color="#d8d4cf"/><stop offset="1" stop-color="#6b6864"/></radialGradient>
    <radialGradient id="dim" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#a8a29b"/><stop offset="1" stop-color="#3a3836"/></radialGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#d8d4cf" stop-opacity=".7"/><stop offset="1" stop-color="#d8d4cf" stop-opacity="0"/></linearGradient>
  </defs>
