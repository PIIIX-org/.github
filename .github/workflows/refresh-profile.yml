# Weekly refresh of the org-profile numbers: commits, merged PRs, last commit,
# the light curve. Re-runs profile/forge.py (the generator git-a-profile committed
# with the page) and commits only if something changed.
name: refresh profile

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate data-driven assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 profile/forge.py
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: refresh profile assets [skip ci]"
            git push
          else
            echo "nothing to refresh"
          fi
